# Builds Tuner on GitHub every time you push.
#  - Every push: runs the tests and builds app-release.apk (download it from the run's "Artifacts").
#  - Push a tag like v5.4.1: also publishes a GitHub release with the APK, which Tuner's
#    Settings › Update Tuner › "Check now" can install on the TV.
#
# One-off set-up (see README › "Automatic builds on GitHub"): add your PC's debug key as the secret
# DEBUG_KEYSTORE_BASE64, so GitHub's APKs install over the ones you built yourself.
name: Build Flicker

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
      # Optional: your TMDB key, built in so film info works without typing it on the TV.
      TUNER_TMDB_KEY: ${{ secrets.TMDB_KEY }}
      # Optional: Google sign-in for "Sync between houses" (see README › Google Drive sync).
      TUNER_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      TUNER_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Use your signing key
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          echo "TUNER_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"

      - name: Stop if a release would be signed with the wrong key
        if: startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_B64 == ''
        run: |
          echo "::error::Add the DEBUG_KEYSTORE_BASE64 secret first – otherwise the TV refuses the update."
          exit 1

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "TUNER_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Maven Central sometimes turns GitHub away for a minute ("429 Too Many Requests").
      # Fetch everything first, and try again a couple of times if that happens.
      - name: Download libraries
        run: |
          for attempt in 1 2 3; do
            if gradle --no-daemon :app:dependencies > /dev/null; then exit 0; fi
            echo "Download failed (attempt $attempt) – waiting a minute and trying again"
            sleep 60
          done
          exit 1

      - name: Run the tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build the APK
        run: gradle --no-daemon assembleRelease

      - name: Keep the APK (download from this run's Artifacts)
        uses: actions/upload-artifact@v5
        with:
          name: tuner-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Keep the test report if something failed
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-report
          path: app/build/reports/tests/

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true

  # Tuner for Windows: built on a Windows machine (installers can only be made there).
  # A separate build, so a problem here never stops the TV app.
  windows:
    # Paused for now – change false to true to build the Windows installer again.
    if: false
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "TUNER_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build the Windows installer
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if gradle --no-daemon -p desktop packageMsi; then exit 0; fi
            echo "Build failed (attempt $attempt) – waiting a minute and trying again"
            sleep 60
          done
          exit 1

      - name: Keep the installer (download from this run's Artifacts)
        uses: actions/upload-artifact@v5
        with:
          name: tuner-windows
          path: desktop/build/compose/binaries/main/msi/*.msi

      - name: Add it to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/build/compose/binaries/main/msi/*.msi

